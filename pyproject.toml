[project]
name = "mdm-log-analyzer"
version = "1.0.0"
description = "Local, stateless MCP server that extracts, parses, and correlates macOS MDM/DDM/installer log events into structured, redacted timelines."
readme = "README.md"
requires-python = ">=3.11"
# Requires the mcp 2.x line: server.py uses `mcp.server.mcpserver.MCPServer`,
# which does not exist in 1.x (where it was `mcp.server.fastmcp.FastMCP`). The
# floor is therefore hard, not conservative — 1.x cannot run this server.
# Capped below 3.0 so the next major cannot break installs the way 2.0 did.
dependencies = ["mcp>=2,<3"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Scalefusion" }]
keywords = ["mcp", "mdm", "ddm", "macos", "mdmclient", "apple", "logs", "diagnostics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Logging",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/scalefusion/apple-mdm-log-analyzer"
Repository = "https://github.com/scalefusion/apple-mdm-log-analyzer"
Issues = "https://github.com/scalefusion/apple-mdm-log-analyzer/issues"
Changelog = "https://github.com/scalefusion/apple-mdm-log-analyzer/blob/main/CHANGELOG.md"

[project.scripts]
mcp-mdm-log-analyzer = "mdm_log_analyzer.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdm_log_analyzer"]

# Keep the sdist to the essentials — no editor caches, tools, or example fixtures.
# The wheel contains everything a runtime needs (predicates JSON + Python modules).
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/LICENSE",
    "/README.md",
    "/SETUP.md",
    "/MAINTAINING.md",
    "/ARCHITECTURE.md",
    "/CONTRIBUTING.md",
    "/CHANGELOG.md",
    "/mdm-log-analyzer-mcp-spec.md",
    "/pyproject.toml",
    "/tests",
    "/tools",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# `Optional` was used in sources.py and never imported. `from __future__ import
# annotations` defers evaluation, so nothing failed until something called
# get_type_hints — exactly the class a linter catches for free. F821 is the rule
# that would have caught it.
[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
# Deliberately narrow to the rules that catch real defects. Enabling "UP"
# additionally flags 68 `Optional[X]` -> `X | None` rewrites, and "I" flags
# import ordering — both worth doing, neither worth mixing into a commit that
# fixes security findings. Widen in a follow-up.
select = [
    "F",    # pyflakes — undefined names (F821, the one that mattered), unused imports
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "B",    # flake8-bugbear — mutable defaults, bare except, loop-variable capture
]
ignore = [
    "E501",  # line length is a formatter concern
    "E402",  # module-level import not at top: tests insert sys.path first
]

[tool.ruff.lint.per-file-ignores]
# Tests build deliberately awkward inputs and import inside functions to keep
# the engine suite stdlib-only.
"tests/*" = ["E402", "F401", "B011"]
